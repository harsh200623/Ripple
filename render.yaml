services:
  - type: web
    name: ripple-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_MODE
        value: inline
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info
